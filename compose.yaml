services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    # The official image is amd64-only: Rosetta on Apple Silicon,
    # QEMU binfmt emulation on the Raspberry Pi.
    platform: linux/amd64

    container_name: university-sqlserver
    restart: unless-stopped

    ports:
      - "1433:1433"

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "1024"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

volumes:
  sqlserver-data:
