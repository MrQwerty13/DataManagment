services:
  postgres:
    image: postgres:18
    container_name: university-postgres
    restart: unless-stopped
    ports:
      # bind to the Pi's LAN (or Tailscale) IP instead of every interface
      - "${BIND_IP:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: university
      TZ: Europe/Moscow
    command:
      - postgres
      - -c
      - shared_buffers=512MB          # ~25% of RAM on a 2-4 GB Pi
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
      - -c
      - random_page_cost=1.1          # SSD
    shm_size: 256mb
    volumes:
      - /mnt/ssd/postgres:/var/lib/postgresql   # data on SSD, not SD card
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d university"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
